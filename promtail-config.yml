server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://parking-loki:3100/loki/api/v1/push # Gunakan nama service di docker-compose

scrape_configs:
  - job_name: parking_system
    static_configs:
      - targets:
          - localhost
        labels:
          job: parking-api
          env: development
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            context: context
      - labels:
          level:
          context: