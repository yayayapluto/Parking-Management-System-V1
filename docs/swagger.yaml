basePath: /api/v1
definitions:
  requests.ApproveRefundRequest:
    properties:
      approved_by:
        type: string
    required:
      - approved_by
    type: object
  requests.CreateCustomerRegistSourceRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  requests.CreateCustomerRequest:
    properties:
      name:
        maxLength: 100
        type: string
      phone:
        maxLength: 20
        type: string
      registration_source_id:
        type: string
      rfid_uid:
        maxLength: 50
        type: string
    required:
      - name
    type: object
  requests.CreateDailySettlementRequest:
    properties:
      date:
        type: string
      total_cash:
        minimum: 0
        type: number
      total_lost_tickets:
        minimum: 0
        type: integer
      total_qris:
        minimum: 0
        type: number
      total_refunds:
        minimum: 0
        type: number
      total_revenue:
        minimum: 0
        type: number
      total_transactions:
        minimum: 0
        type: integer
    required:
      - date
      - total_cash
      - total_lost_tickets
      - total_qris
      - total_refunds
      - total_revenue
      - total_transactions
    type: object
  requests.CreateHolidayRequest:
    properties:
      affects_rates:
        minimum: 0
        type: number
      date:
        example: "2026-01-01"
        type: string
      name:
        maxLength: 100
        type: string
    required:
    - date
    - name
    type: object
  requests.CreateLostTicketFeeRequest:
    properties:
      lost_ticket_fee:
        minimum: 0
        type: number
      original_fee:
        minimum: 0
        type: number
      processed_by:
        type: string
      reason:
        maxLength: 255
        type: string
      transaction_id:
        type: string
    required:
      - lost_ticket_fee
      - original_fee
      - processed_by
      - transaction_id
    type: object
  requests.CreateManualCorrectionRequest:
    properties:
      corrected_by:
        type: string
      field_corrected:
        maxLength: 100
        type: string
      new_value:
        maxLength: 255
        type: string
      old_value:
        maxLength: 255
        type: string
      reason:
        maxLength: 500
        type: string
      transaction_id:
        type: string
    required:
      - corrected_by
      - field_corrected
      - new_value
      - old_value
      - reason
      - transaction_id
    type: object
  requests.CreatePaymentMethodRequest:
    properties:
      code:
        maxLength: 20
        type: string
      config:
        description: Kita terima sebagai slice string biasa
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
    required:
    - code
    - name
    type: object
  requests.CreateRefundRequest:
    properties:
      amount:
        minimum: 0
        type: number
      payment_id:
        type: string
      reason:
        maxLength: 255
        type: string
      refunded_by:
        type: string
      transaction_id:
        type: string
    required:
      - amount
      - payment_id
      - reason
      - refunded_by
      - transaction_id
    type: object
  requests.CreateRoleRequest:
    properties:
      created_by:
        maxLength: 100
        type: string
      name:
        maxLength: 50
        type: string
      permission_id:
        type: string
    required:
    - name
    - permission_id
    type: object
  requests.CreateTransactionEventRequest:
    properties:
      event_type:
        enum:
          - entry
          - exit
          - manual_entry
          - manual_exit
          - correction
          - lost_ticket
        type: string
      notes:
        maxLength: 5000
        type: string
      operator_id:
        type: string
      photo_path:
        maxLength: 500
        type: string
      plate_detected:
        maxLength: 20
        type: string
      rfid_detected:
        maxLength: 50
        type: string
      transaction_id:
        type: string
    required:
      - event_type
      - operator_id
      - transaction_id
    type: object
  requests.CreateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      full_name:
        maxLength: 100
        type: string
      password:
        minLength: 8
        type: string
      phone:
        maxLength: 20
        type: string
      role_id:
        type: string
      username:
        maxLength: 50
        type: string
    required:
    - email
    - full_name
    - password
    - role_id
    - username
    type: object
  requests.CreateVehicleRequest:
    properties:
      customer_id:
        type: string
      description:
        maxLength: 1000
        type: string
      plate_number:
        maxLength: 20
        type: string
      vehicle_type_id:
        type: string
    required:
      - plate_number
      - vehicle_type_id
    type: object
  requests.CreateVehicleTypeRequest:
    properties:
      code:
        maxLength: 10
        type: string
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        type: string
    required:
    - code
    - name
    type: object
  requests.CreateZoneRateRequest:
    properties:
      daily_max_rate:
        minimum: 0
        type: number
      effective_hour_from:
        type: string
      effective_hour_to:
        type: string
      free_minutes:
        minimum: 0
        type: integer
      holiday_id:
        type: string
      hourly_rate:
        minimum: 0
        type: number
      is_holiday:
        type: boolean
      is_weekend:
        type: boolean
      valid_from:
        type: string
      valid_to:
        type: string
      vehicle_type_id:
        type: string
      zone_id:
        type: string
    required:
    - daily_max_rate
    - hourly_rate
    - valid_from
    - valid_to
    - vehicle_type_id
    - zone_id
    type: object
  requests.CreateZoneRequest:
    properties:
      default_fee:
        minimum: 0
        type: number
      description:
        maxLength: 1000
        type: string
      is_24_hours:
        type: boolean
      location:
        maxLength: 255
        type: string
      maximum_capacity:
        minimum: 1
        type: integer
      name:
        maxLength: 100
        type: string
      operating_hour_end:
        type: string
      operating_hour_start:
        type: string
      zone_type_id:
        type: string
    required:
    - default_fee
    - location
    - maximum_capacity
    - name
    - zone_type_id
    type: object
  requests.CreateZoneTypeRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  requests.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  requests.LoginWithUsernameRequest:
    properties:
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        type: string
    required:
    - password
    - username
    type: object
  requests.ParkingEntryRequest:
    properties:
      operator_id:
        description: |-
          OperatorID is the hashed ID of the operator (parking attendant) recording the entry
          If not provided, it will be extracted from JWT context
        type: string
      plate_number:
        description: PlateNumber is the vehicle's license plate number
        maxLength: 20
        minLength: 3
        type: string
      rfid_uid:
        description: RfidUID is the RFID tag UID for automatic vehicle identification
          (required)
        maxLength: 50
        type: string
      vehicle_type_id:
        description: VehicleTypeID is the hashed ID of the vehicle type (e.g., "motorcycle",
          "car", "truck")
        type: string
      zone_id:
        description: ZoneID is the hashed ID of the parking zone where the vehicle
          is entering
        type: string
    required:
    - plate_number
    - rfid_uid
    - vehicle_type_id
    - zone_id
    type: object
  requests.ParkingExitRequest:
    properties:
      payment_method:
        description: PaymentMethod is the method used for payment (manual or qris)
        enum:
          - manual
          - qris
        type: string
      rfid_uid:
        description: RfidUID is the RFID tag UID for identifying the vehicle
        maxLength: 50
        type: string
    required:
      - payment_method
      - rfid_uid
    type: object
  requests.ReconcileDailySettlementRequest:
    properties:
      notes:
        maxLength: 500
        type: string
      reconciled_by:
        type: string
    required:
      - reconciled_by
    type: object
  requests.RejectRefundRequest:
    properties:
      reason:
        maxLength: 255
        type: string
    required:
      - reason
    type: object
  requests.UpdateCustomerRegistSourceRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        type: string
    type: object
  requests.UpdateCustomerRequest:
    properties:
      is_registered:
        type: boolean
      name:
        maxLength: 100
        type: string
      phone:
        maxLength: 20
        type: string
      registration_source_id:
        type: string
      rfid_uid:
        maxLength: 50
        type: string
    type: object
  requests.UpdateHolidayRequest:
    properties:
      affects_rates:
        minimum: 0
        type: number
      name:
        maxLength: 100
        type: string
    type: object
  requests.UpdatePaymentMethodRequest:
    properties:
      config:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  requests.UpdateRefundRequest:
    properties:
      amount:
        minimum: 0
        type: number
      approved_by:
        type: string
      reason:
        maxLength: 255
        type: string
      status:
        enum:
          - requested
          - pending_approval
          - approved
          - rejected
          - completed
        type: string
    type: object
  requests.UpdateRoleRequest:
    properties:
      name:
        maxLength: 50
        type: string
      permission_id:
        type: string
      updated_by:
        maxLength: 100
        type: string
    type: object
  requests.UpdateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      full_name:
        maxLength: 100
        type: string
      is_active:
        type: boolean
      phone:
        maxLength: 20
        type: string
      role_id:
        type: string
    type: object
  requests.UpdateVehicleRequest:
    properties:
      customer_id:
        type: string
      description:
        maxLength: 1000
        type: string
      plate_number:
        maxLength: 20
        type: string
      vehicle_type_id:
        type: string
    type: object
  requests.UpdateVehicleTypeRequest:
    properties:
      code:
        maxLength: 10
        type: string
      description:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
    type: object
  requests.UpdateZoneRateRequest:
    properties:
      daily_max_rate:
        minimum: 0
        type: number
      effective_hour_from:
        type: string
      effective_hour_to:
        type: string
      free_minutes:
        minimum: 0
        type: integer
      holiday_id:
        type: string
      hourly_rate:
        minimum: 0
        type: number
      is_active:
        type: boolean
      is_holiday:
        type: boolean
      is_weekend:
        type: boolean
      valid_from:
        type: string
      valid_to:
        type: string
      vehicle_type_id:
        type: string
      zone_id:
        type: string
    type: object
  requests.UpdateZoneRequest:
    properties:
      default_fee:
        minimum: 0
        type: number
      description:
        maxLength: 1000
        type: string
      is_24_hours:
        type: boolean
      is_active:
        type: boolean
      is_in_maintenance:
        type: boolean
      location:
        maxLength: 255
        type: string
      maximum_capacity:
        minimum: 1
        type: integer
      name:
        maxLength: 100
        type: string
      operating_hour_end:
        type: string
      operating_hour_start:
        type: string
      zone_type_id:
        type: string
    type: object
  requests.UpdateZoneTypeRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        type: string
    type: object
  responses.BaseResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  responses.Meta:
    properties:
      current_page:
        type: integer
      current_url:
        description: Navigasi URL
        type: string
      filters:
        additionalProperties: true
        type: object
      first_page:
        description: Navigasi Angka
        type: integer
      first_url:
        type: string
      last_page:
        type: integer
      last_url:
        type: string
      limit:
        type: integer
      next_page:
        type: integer
      next_url:
        type: string
      prev_page:
        description: Pakai pointer biar bisa null kalau gak ada
        type: integer
      prev_url:
        type: string
      search:
        type: string
      sort:
        description: Search & Filter
        type: string
      total_data:
        type: integer
      total_page:
        type: integer
    type: object
  responses.PageResponse:
    properties:
      data: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/responses.Meta'
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Dokumentasi API Sistem Manajemen Parkir.
  title: Parking API
  version: "1.0"
paths:
  /api/v1/admin/reports/daily-settlements:
    get:
      consumes:
        - application/json
      description: Retrieve all daily settlements with pagination support
      parameters:
        - default: 1
          description: Page number
          in: query
          name: page
          type: integer
        - default: 10
          description: Items per page
          in: query
          name: limit
          type: integer
        - description: Search term
          in: query
          name: search
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.PageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Get all daily settlements
      tags:
        - Reporting
    post:
      consumes:
        - application/json
      description: Create a new daily settlement record
      parameters:
        - description: Daily settlement data
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/requests.CreateDailySettlementRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Create a new daily settlement
      tags:
        - Reporting
  /api/v1/admin/reports/daily-settlements/{id}:
    delete:
      consumes:
        - application/json
      description: Delete a specific daily settlement by its ID
      parameters:
        - description: Daily settlement ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Delete a daily settlement
      tags:
        - Reporting
    get:
      consumes:
        - application/json
      description: Retrieve a specific daily settlement by its ID
      parameters:
        - description: Daily settlement ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Get daily settlement by ID
      tags:
        - Reporting
  /api/v1/admin/reports/daily-settlements/{id}/reconcile:
    post:
      consumes:
        - application/json
      description: Reconcile a specific daily settlement by its ID
      parameters:
        - description: Daily settlement ID
          in: path
          name: id
          required: true
          type: string
        - description: Reconciliation data
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/requests.ReconcileDailySettlementRequest'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Reconcile a daily settlement
      tags:
        - Reporting
  /api/v1/operations/manual-corrections:
    get:
      consumes:
        - application/json
      description: Retrieve all manual corrections with pagination support
      parameters:
        - default: 1
          description: Page number
          in: query
          name: page
          type: integer
        - default: 10
          description: Items per page
          in: query
          name: limit
          type: integer
        - description: Search term
          in: query
          name: search
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.PageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Get all manual corrections
      tags:
        - Operations
    post:
      consumes:
        - application/json
      description: Create a new manual correction record
      parameters:
        - description: Manual correction data
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/requests.CreateManualCorrectionRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Create a new manual correction
      tags:
        - Operations
  /api/v1/operations/manual-corrections/{id}:
    delete:
      consumes:
        - application/json
      description: Delete a specific manual correction by its ID
      parameters:
        - description: Manual correction ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Delete a manual correction
      tags:
        - Operations
    get:
      consumes:
        - application/json
      description: Retrieve a specific manual correction by its ID
      parameters:
        - description: Manual correction ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Get manual correction by ID
      tags:
        - Operations
  /api/v1/operations/transaction-events:
    get:
      consumes:
        - application/json
      description: Retrieve all transaction events with pagination support
      parameters:
        - default: 1
          description: Page number
          in: query
          name: page
          type: integer
        - default: 10
          description: Items per page
          in: query
          name: limit
          type: integer
        - description: Search term
          in: query
          name: search
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.PageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Get all transaction events
      tags:
        - Operations
    post:
      consumes:
        - application/json
      description: Create a new transaction event record
      parameters:
        - description: Transaction event data
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/requests.CreateTransactionEventRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Create a new transaction event
      tags:
        - Operations
  /api/v1/operations/transaction-events/{id}:
    delete:
      consumes:
        - application/json
      description: Delete a specific transaction event by its ID
      parameters:
        - description: Transaction event ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Delete a transaction event
      tags:
        - Operations
    get:
      consumes:
        - application/json
      description: Retrieve a specific transaction event by its ID
      parameters:
        - description: Transaction event ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Get transaction event by ID
      tags:
        - Operations
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Login with Email
      tags:
      - Auth
  /auth/login-username:
    post:
      consumes:
      - application/json
      description: Authenticate user with username and password
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.LoginWithUsernameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Login with Username
      tags:
      - Auth
  /customer-regist-sources:
    get:
      consumes:
      - application/json
      description: Get list of customer registration sources with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search by name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.PageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      summary: Get All Customer Registration Sources
      tags:
      - Customer Registration Sources
    post:
      consumes:
      - application/json
      parameters:
      - description: Customer Registration Source Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateCustomerRegistSourceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
