basePath: /api/v1
definitions:
  requests.CreateCustomerRegistSourceRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        type: string
    required:
      - name
    type: object
  requests.CreateHolidayRequest:
    properties:
      affects_rates:
        minimum: 0
        type: number
      date:
        example: "2026-01-01"
        type: string
      name:
        maxLength: 100
        type: string
    required:
      - date
      - name
    type: object
  requests.CreatePaymentMethodRequest:
    properties:
      code:
        maxLength: 20
        type: string
      config:
        description: Kita terima sebagai slice string biasa
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
    required:
      - code
      - name
    type: object
  requests.CreateVehicleTypeRequest:
    properties:
      code:
        maxLength: 10
        type: string
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        type: string
    required:
      - code
      - name
    type: object
  requests.CreateZoneTypeRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        type: string
    required:
      - name
    type: object
  requests.UpdateCustomerRegistSourceRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        type: string
    type: object
  requests.UpdateHolidayRequest:
    properties:
      affects_rates:
        minimum: 0
        type: number
      name:
        maxLength: 100
        type: string
    type: object
  requests.UpdatePaymentMethodRequest:
    properties:
      config:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
    required:
      - name
    type: object
  requests.UpdateVehicleTypeRequest:
    properties:
      code:
        maxLength: 10
        type: string
      description:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
    type: object
  requests.UpdateZoneTypeRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        type: string
    type: object
  responses.BaseResponse:
    properties:
      data: { }
      errors: { }
      message:
        type: string
      success:
        type: boolean
    type: object
  responses.Meta:
    properties:
      current_page:
        type: integer
      current_url:
        description: Navigasi URL
        type: string
      filters:
        additionalProperties: true
        type: object
      first_page:
        description: Navigasi Angka
        type: integer
      first_url:
        type: string
      last_page:
        type: integer
      last_url:
        type: string
      limit:
        type: integer
      next_page:
        type: integer
      next_url:
        type: string
      prev_page:
        description: Pakai pointer biar bisa null kalau gak ada
        type: integer
      prev_url:
        type: string
      search:
        type: string
      sort:
        description: Search & Filter
        type: string
      total_data:
        type: integer
      total_page:
        type: integer
    type: object
  responses.PageResponse:
    properties:
      data: { }
      message:
        type: string
      meta:
        $ref: '#/definitions/responses.Meta'
      success:
        type: boolean
    type: object
host: localhost:8080
