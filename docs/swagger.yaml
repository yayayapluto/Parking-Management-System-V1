basePath: /api/v1
definitions:
  requests.CreateCustomerRegistSourceRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  requests.CreateHolidayRequest:
    properties:
      affects_rates:
        minimum: 0
        type: number
      date:
        example: "2026-01-01"
        type: string
      name:
        maxLength: 100
        type: string
    required:
    - date
    - name
    type: object
  requests.CreatePaymentMethodRequest:
    properties:
      code:
        maxLength: 20
        type: string
      config:
        description: Kita terima sebagai slice string biasa
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
    required:
    - code
    - name
    type: object
  requests.CreateRoleRequest:
    properties:
      created_by:
        maxLength: 100
        type: string
      name:
        maxLength: 50
        type: string
      permission_id:
        type: string
    required:
    - name
    - permission_id
    type: object
  requests.CreateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      full_name:
        maxLength: 100
        type: string
      password:
        minLength: 8
        type: string
      phone:
        maxLength: 20
        type: string
      role_id:
        type: string
      username:
        maxLength: 50
        type: string
    required:
    - email
    - full_name
    - password
    - role_id
    - username
    type: object
  requests.CreateVehicleTypeRequest:
    properties:
      code:
        maxLength: 10
        type: string
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        type: string
    required:
    - code
    - name
    type: object
  requests.CreateZoneRateRequest:
    properties:
      daily_max_rate:
        minimum: 0
        type: number
      effective_hour_from:
        type: string
      effective_hour_to:
        type: string
      free_minutes:
        minimum: 0
        type: integer
      holiday_id:
        type: string
      hourly_rate:
        minimum: 0
        type: number
      is_holiday:
        type: boolean
      is_weekend:
        type: boolean
      valid_from:
        type: string
      valid_to:
        type: string
      vehicle_type_id:
        type: string
      zone_id:
        type: string
    required:
    - daily_max_rate
    - hourly_rate
    - valid_from
    - valid_to
    - vehicle_type_id
    - zone_id
    type: object
  requests.CreateZoneRequest:
    properties:
      default_fee:
        minimum: 0
        type: number
      description:
        maxLength: 1000
        type: string
      is_24_hours:
        type: boolean
      location:
        maxLength: 255
        type: string
      maximum_capacity:
        minimum: 1
        type: integer
      name:
        maxLength: 100
        type: string
      operating_hour_end:
        type: string
      operating_hour_start:
        type: string
      zone_type_id:
        type: string
    required:
    - default_fee
    - location
    - maximum_capacity
    - name
    - zone_type_id
    type: object
  requests.CreateZoneTypeRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  requests.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  requests.LoginWithUsernameRequest:
    properties:
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        type: string
    required:
    - password
    - username
    type: object
  requests.UpdateCustomerRegistSourceRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        type: string
    type: object
  requests.UpdateHolidayRequest:
    properties:
      affects_rates:
        minimum: 0
        type: number
      name:
        maxLength: 100
        type: string
    type: object
  requests.UpdatePaymentMethodRequest:
    properties:
      config:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  requests.UpdateRoleRequest:
    properties:
      name:
        maxLength: 50
        type: string
      permission_id:
        type: string
      updated_by:
        maxLength: 100
        type: string
    type: object
  requests.UpdateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      full_name:
        maxLength: 100
        type: string
      is_active:
        type: boolean
      phone:
        maxLength: 20
        type: string
      role_id:
        type: string
    type: object
  requests.UpdateVehicleTypeRequest:
    properties:
      code:
        maxLength: 10
        type: string
      description:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 50
        type: string
    type: object
  requests.UpdateZoneRateRequest:
    properties:
      daily_max_rate:
        minimum: 0
        type: number
      effective_hour_from:
        type: string
      effective_hour_to:
        type: string
      free_minutes:
        minimum: 0
        type: integer
      holiday_id:
        type: string
      hourly_rate:
        minimum: 0
        type: number
      is_active:
        type: boolean
      is_holiday:
        type: boolean
      is_weekend:
        type: boolean
      valid_from:
        type: string
      valid_to:
        type: string
      vehicle_type_id:
        type: string
      zone_id:
        type: string
    type: object
  requests.UpdateZoneRequest:
    properties:
      default_fee:
        minimum: 0
        type: number
      description:
        maxLength: 1000
        type: string
      is_24_hours:
        type: boolean
      is_active:
        type: boolean
      is_in_maintenance:
        type: boolean
      location:
        maxLength: 255
        type: string
      maximum_capacity:
        minimum: 1
        type: integer
      name:
        maxLength: 100
        type: string
      operating_hour_end:
        type: string
      operating_hour_start:
        type: string
      zone_type_id:
        type: string
    type: object
  requests.UpdateZoneTypeRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        type: string
    type: object
  responses.BaseResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  responses.Meta:
    properties:
      current_page:
        type: integer
      current_url:
        description: Navigasi URL
        type: string
      filters:
        additionalProperties: true
        type: object
      first_page:
        description: Navigasi Angka
        type: integer
      first_url:
        type: string
      last_page:
        type: integer
      last_url:
        type: string
      limit:
        type: integer
      next_page:
        type: integer
      next_url:
        type: string
      prev_page:
        description: Pakai pointer biar bisa null kalau gak ada
        type: integer
      prev_url:
        type: string
      search:
        type: string
      sort:
        description: Search & Filter
        type: string
      total_data:
        type: integer
      total_page:
        type: integer
    type: object
  responses.PageResponse:
    properties:
      data: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/responses.Meta'
      success:
        type: boolean
    type: object
