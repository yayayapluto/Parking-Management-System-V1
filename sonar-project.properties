# SonarQube Configuration for Parking Management System

# Project identification
sonar.projectKey=parking-management-system-v1
sonar.projectName=Parking Management System v1
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=internal,pkg
sonar.tests=internal
sonar.test.inclusions=**/*_test.go

# Exclusions
sonar.exclusions=**/vendor/**,**/node_modules/**,**/*.pb.go

# Go-specific settings
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json

# Code coverage
sonar.coverage.exclusions=**/*_test.go,**/mocks/**,**/vendor/**

# Quality gate settings
sonar.qualitygate.wait=true

# Language
sonar.language=go

# Encoding
sonar.sourceEncoding=UTF-8

# Host URL (update with your SonarQube server)
# sonar.host.url=http://localhost:9000
# sonar.login=your-sonarqube-token
