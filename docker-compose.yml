services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: parking-db
    environment:
      POSTGRES_USER: admin_parking
      POSTGRES_PASSWORD: parking_password
      POSTGRES_DB: parking_db
    ports:
      - "5432:5432"
    volumes:
      - parking_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin_parking -d parking_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Gudang Log
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # Si Pengirim Log
  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./storage/logs:/var/log/app  # Mount folder log lo ke sini
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml

  # Si Dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  parking_data: